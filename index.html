<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="잔향 백과: 게임 개념을 분류별로 찾아보는 위키와 건의·질문 창구">
<title>잔향 위키</title>
<script>try { const t = localStorage.getItem('jh.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 머리 줄(로고 / MAIN) + 저장소식 탭 메뉴 + 본문(항목 목록 · 문서). 내용이 가장 크게 보이도록 메뉴는 작게. */
:root{
  --bg:#0f1012; --head:#16171a; --panel:#16171a; --well:#23242a; --line:#2e3036; --fg:#eceef1; --fg2:#c9ccd2; --mute:#8f939b; --red:#ff5b6c; --red-bg:#c8142a; --red-ink:#fff; --tint:rgba(255,91,108,.12);
  --body:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#fff;--head:#f6f7f8;--panel:#fff;--well:#eff1f3;--line:#d8dce0;--fg:#1c1f23;--fg2:#3a3f46;--mute:#656b74;--red:#b3102a;--red-bg:#c4122a;--tint:rgba(196,18,42,.07);color-scheme:light}}
:root[data-theme="light"]{--bg:#fff;--head:#f6f7f8;--panel:#fff;--well:#eff1f3;--line:#d8dce0;--fg:#1c1f23;--fg2:#3a3f46;--mute:#656b74;--red:#b3102a;--red-bg:#c4122a;--tint:rgba(196,18,42,.07);color-scheme:light}
html,body{margin:0}*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15.5px/1.7 var(--body);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
/* 머리 */
header{background:var(--head);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--red-bg);color:#fff;font:700 12px/22px var(--body);text-align:center;font-style:normal}
.slash{color:var(--mute)}
.main-link{font-weight:600;font-size:14px;letter-spacing:.04em;padding:2px 6px;border-radius:6px}
.main-link:hover{background:var(--well)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;flex:1;justify-content:flex-end}
.search{position:relative;flex:1;min-width:0;max-width:320px}
.search input{width:100%;height:32px;padding:0 10px 0 30px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;border-radius:6px}
.search svg{position:absolute;left:9px;top:8px;color:var(--mute)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);color:var(--fg2);border-radius:6px;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--fg);border-color:var(--mute)}
.help{display:flex;gap:2px}
.help a{display:flex;align-items:center;gap:5px;height:32px;padding:0 8px;border-radius:6px;font-size:13.5px;color:var(--fg2);white-space:nowrap}
.help a:hover{background:var(--well);color:var(--fg)}.help a[aria-current="page"]{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--red)}
nav.tabs .narrow{display:none}
/* 탭 메뉴 */
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:8px 8px 9px;font-size:14px;color:var(--fg2);white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a:hover span:not(.cnt){background:var(--well);border-radius:6px}
nav.tabs a[aria-current="page"]{color:var(--fg);font-weight:600;border-bottom-color:var(--red)}
nav.tabs .cnt{font-size:12px;line-height:18px;padding:0 6px;border-radius:9px;background:var(--well);color:var(--fg2);font-weight:500}
nav.tabs .sep{width:1px;background:var(--line);margin:8px 6px}
/* 본문 */
.body{display:grid;grid-template-columns:236px minmax(0,1fr);gap:36px;padding-top:24px;padding-bottom:80px}
.body.wide{grid-template-columns:minmax(0,1fr)}
details.side>summary{display:none}
.side .hd{font-size:12.5px;font-weight:600;color:var(--mute);padding:0 10px 6px;display:flex;justify-content:space-between}
.side a{display:block;padding:4px 10px;font-size:14px;color:var(--fg2);border-radius:6px;line-height:1.5;position:relative}
.side a:hover{background:var(--well);color:var(--fg)}
.side a[aria-current="page"]{background:var(--well);color:var(--fg);font-weight:600}
.side a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--red)}
.side a .c{color:var(--mute);font-size:12px;font-weight:400}
.side nav{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-left:8px}
article{min-width:0;max-width:780px}
.crumb{font-size:13px;color:var(--mute);margin-bottom:4px}.crumb a:hover{color:var(--red)}
h1{font-size:26px;line-height:1.35;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sum{font-size:16.5px;color:var(--fg);margin:12px 0 18px}
.blk{margin:0 0 16px}.blk h2{font-size:16px;margin:0 0 4px}
.blk p{margin:0 0 8px;color:var(--fg2)}
.blk ul,.blk ol{margin:0 0 8px;padding-left:22px;color:var(--fg2)}.blk li{margin:0 0 3px}
dl.dl{margin:0 0 8px;display:grid;grid-template-columns:minmax(84px,max-content) minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
dl.dl dt,dl.dl dd{margin:0;padding:6px 12px;border-top:1px solid var(--line)}
dl.dl dt:first-of-type,dl.dl dt:first-of-type+dd{border-top:0}
dl.dl dt{font-weight:600;background:var(--head)}dl.dl dd{color:var(--fg2)}
.sec-t{font-size:14px;font-weight:600;margin:26px 0 6px}
.rows{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rows a{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-top:1px solid var(--line);font-size:14.5px}
.rows a:first-child{border-top:0}
.rows a:hover{background:var(--head)}.rows a:hover b{color:var(--red)}
.rows a svg{align-self:center;color:var(--mute)}
.rows b{font-weight:600;white-space:nowrap}
.rows small{color:var(--mute);font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rows .n{color:var(--mute);font-size:12.5px;margin-left:auto;white-space:nowrap}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.pn a{color:var(--fg2)}.pn a:hover{color:var(--red)}.pn small{display:block;color:var(--mute);font-size:12px}
mark{background:var(--tint);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--red)}
/* MAIN */
.home{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:36px}
.home h1{border:0;padding:0}
.lead{color:var(--fg2);margin:0 0 6px}
.lead a,.about a{color:var(--red)}
.about{font-size:14px;color:var(--fg2)}
.about h2{font-size:15px;margin:0 0 8px}
.about p{margin:0 0 10px}
.about ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.about li{display:flex;gap:8px;align-items:center}.about li svg{color:var(--mute)}
.about .tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:9px;border:1px solid var(--line);color:var(--fg2)}
/* 질문·기록 */
.faq details{border-bottom:1px solid var(--line);padding:9px 0}.faq summary{cursor:pointer;font-weight:600}
.faq details p{margin:6px 0 0;color:var(--fg2)}.faq a{color:var(--red)}
.log .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.log .v{font-weight:600}.log .v small{display:block;color:var(--mute);font-weight:400;font-size:13px}.log ul{margin:0;padding-left:18px;color:var(--fg2)}
/* 건의·질문 */
.box{border:1px solid var(--line);background:var(--panel);padding:16px;display:grid;gap:14px;border-radius:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--fg2);font:inherit;font-size:14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--well);font-weight:600}
label.f{display:grid;gap:4px;font-size:14.5px;font-weight:600}label.f small{font-weight:400;color:var(--mute)}
label.f input,label.f textarea{font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:6px;width:100%}
label.f textarea{min-height:120px;resize:vertical}
label.ck{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
label.ck input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--red-bg);flex:none}label.ck small{display:block;color:var(--mute);font-size:13px}
.btn{min-height:40px;padding:0 18px;border:0;background:var(--red-bg);color:var(--red-ink);font:600 14.5px var(--body);border-radius:6px;cursor:pointer;justify-self:start}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--mute);margin:0}.status{font-size:14.5px;margin:0}
.filters{margin:18px 0 8px}
.ideas{display:grid;gap:8px}
.idea{border:1px solid var(--line);padding:12px 14px;display:grid;gap:4px;border-radius:6px}
.idea .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.idea .k,.idea .st,.idea .pv{font-size:12px;font-weight:600;padding:0 8px;border-radius:9px;border:1px solid var(--line);color:var(--fg2)}
.idea .st.done{background:var(--red-bg);border-color:var(--red-bg);color:var(--red-ink)}.idea .pv{border-color:var(--red);color:var(--red)}
.idea b{font-size:15.5px}.idea p{margin:0;color:var(--fg2);white-space:pre-wrap}
.idea .re{border-left:2px solid var(--red);padding-left:10px;margin-top:4px;font-size:14.5px}
.empty{color:var(--mute);font-size:14.5px;margin:0}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr)}.about{border-top:1px solid var(--line);padding-top:16px}}
@media (max-width:760px){
  .body{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}
  details.side{border:1px solid var(--line);border-radius:6px}
  details.side>summary{display:block;cursor:pointer;padding:8px 12px;font-size:14px;font-weight:600}
  .side nav{position:static;max-height:none;padding:0 8px 8px}
  .side .hd{display:none}
  .side a[aria-current="page"]::before{display:none}
  .search{max-width:none}
  .rows small{display:none}
  dl.dl{grid-template-columns:minmax(0,38%) minmax(0,1fr)}
  .log .row{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (max-width:1280px) and (min-width:1001px){nav.tabs .cnt{display:none}}
@media (max-width:1000px){.help{display:none}nav.tabs .narrow{display:flex}nav.tabs .sep.narrow{display:block}}
@media (max-width:420px){.logo span{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="#/" aria-label="잔향 위키 MAIN"><i aria-hidden="true">잔</i><span>잔향 위키</span></a>
    <span class="slash" aria-hidden="true">/</span>
    <a class="main-link" href="#/">MAIN</a>
    <div class="tools">
      <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="항목 찾기" aria-label="항목 찾기" autocomplete="off"></label>
      <nav class="help" id="help" aria-label="도움"></nav>
      <button class="icon-btn" id="theme" type="button"></button>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" aria-label="분류"></nav></div>
</header>

<div class="wrap body" id="body">
  <details class="side" id="side" open><summary id="sideSum"></summary><nav id="list" aria-label="항목 목록"></nav></details>
  <main id="pane">
    <div id="art"><p class="empty">불러오는 중입니다…</p></div>
    <div id="desk" hidden>
      <h1>건의·질문</h1>
      <p class="sum">로그인 없이 남길 수 있습니다. 운영진이 확인하면 상태가 바뀌고 답변이 달립니다.</p>
      <div class="box">
        <div class="seg" role="group" aria-label="분류" id="cats"></div>
        <label class="f" for="iNick">헌터 이름 <small>선택 · 비워 두면 '익명 헌터'</small><input id="iNick" maxlength="16"></label>
        <label class="f" for="iTitle">제목<input id="iTitle" maxlength="60"></label>
        <label class="f" for="iBody">내용<textarea id="iBody" maxlength="1200"></textarea></label>
        <label class="ck" for="iPriv"><input id="iPriv" type="checkbox"><span>비공개로 남기기<small>운영진과 나만 봅니다. 이 기기·브라우저에서만 다시 볼 수 있습니다.</small></span></label>
        <button class="btn" id="iSend" type="button" disabled>남기기</button>
        <p class="status" id="iStatus" role="status"></p>
        <p class="hint">한 기기에서 하루 5건까지. 연락처·실명 같은 개인정보는 적지 마세요.</p>
      </div>
      <div class="seg filters" role="group" aria-label="목록 보기" id="flt"></div>
      <div class="ideas" id="ideaList"><p class="empty">목록을 불러오는 중입니다…</p></div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ICON = {
    home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
    book: '<path d="M5 4h11a3 3 0 0 1 3 3v14H8a3 3 0 0 1-3-3z"/><path d="M5 18a3 3 0 0 1 3-3h11"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
    map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
    skull: '<path d="M12 3a8 8 0 0 0-5 14.2V21h10v-3.8A8 8 0 0 0 12 3z"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/>',
    shield: '<path d="M12 3 5 6v6c0 4 3 7.5 7 9 4-1.5 7-5 7-9V6z"/>',
    up: '<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    coins: '<circle cx="9" cy="9" r="6"/><path d="M15.4 9.6A6 6 0 1 1 9.6 15.4"/>',
    building: '<path d="M4 21V5l8-3v19M12 8h8v13M3 21h18"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'
  };
  const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n] || ''}</svg>`;

  /* 화면 밝기: 저장한 값이 없으면 기기 설정을 따른다 */
  const mq = matchMedia('(prefers-color-scheme: light)');
  const isLight = () => (document.documentElement.dataset.theme || (mq.matches ? 'light' : 'dark')) === 'light';
  const paintTheme = () => { const l = isLight(); $('#theme').innerHTML = ic(l ? 'moon' : 'sun'); $('#theme').setAttribute('aria-label', l ? '어두운 화면으로' : '밝은 화면으로'); $('#theme').title = l ? '어두운 화면으로' : '밝은 화면으로'; };
  $('#theme').addEventListener('click', () => { const t = isLight() ? 'dark' : 'light'; document.documentElement.dataset.theme = t; try { localStorage.setItem('jh.theme', t); } catch (e) {} paintTheme(); });
  mq.addEventListener && mq.addEventListener('change', paintTheme); paintTheme();

  let W = null, BY = {}, q = '';
  const hl = t => { const e = esc(t); if (!q) return e; const k = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return e.replace(new RegExp(k, 'gi'), m => `<mark>${m}</mark>`); };
  const catOf = id => W.cats.find(c => c.id === id);
  const inCat = id => W.entries.filter(x => x.cat === id);
  const link = x => `#/e/${x.id}`;
  const row = (x, right) => `<a href="${link(x)}">${ic('doc')}<b>${esc(x.t)}</b><small>${esc(x.s)}</small>${right ? `<span class="n">${esc(right)}</span>` : ''}</a>`;
  const narrow = matchMedia('(max-width:760px)');

  function search(s) {
    const k = s.toLowerCase(), r = [];
    W.entries.forEach(x => { const t = x.t.toLowerCase(), al = x.k.join(' ').toLowerCase();
      const sc = t === k ? 0 : t.includes(k) ? 1 : al.includes(k) ? 2 : x.s.toLowerCase().includes(k) ? 3 : JSON.stringify(x.b).toLowerCase().includes(k) ? 4 : -1;
      if (sc >= 0) r.push([sc, x]); });
    return r.sort((a, b) => a[0] - b[0]).map(a => a[1]);
  }
  function route() { const h = location.hash.replace(/^#\/?/, '').split('/'); return { v: h[0] || 'home', id: h[1] ? decodeURIComponent(h[1]) : '' }; }

  function tabs(r, curCat) {
    const a = (href, icon, name, n, on, cls) => `<a href="${href}"${cls ? ` class="${cls}"` : ''}${on ? ' aria-current="page"' : ''}>${ic(icon)}<span>${esc(name)}</span>${n != null ? `<span class="cnt">${n}</span>` : ''}</a>`;
    const H = [['#/faq', 'help', '자주 묻는 질문', 'faq'], ['#/log', 'history', '업데이트', 'log'], ['#/ask', 'mail', '건의·질문', 'ask']];
    $('#tabs').innerHTML = a('#/', 'home', 'MAIN', null, r.v === 'home' && !q) +
      W.cats.map(c => a(`#/c/${c.id}`, c.icon, c.name, inCat(c.id).length, curCat === c.id && !q)).join('') +
      '<span class="sep narrow" aria-hidden="true"></span>' + H.map(([h, i, n, v]) => a(h, i, n, null, r.v === v, 'narrow')).join('');
    $('#help').innerHTML = H.map(([h, i, n, v]) => a(h, i, n, null, r.v === v)).join('');
    const cur = $('#tabs a[aria-current]'); if (cur) { const n = $('#tabs'); const l = cur.offsetLeft - n.offsetLeft; if (l < n.scrollLeft || l + cur.offsetWidth > n.scrollLeft + n.clientWidth) n.scrollLeft = l - 16; }
  }
  function side(r, curCat) {
    let head, items, label;
    if (q) { items = search(q); head = `'${esc(q)}' 찾기`; label = `찾은 항목 ${items.length}개`; }
    else if (curCat) { const c = catOf(curCat); items = inCat(curCat); head = esc(c.name); label = `${c.name} 항목 ${items.length}개`; }
    else return false;
    $('#sideSum').textContent = label;
    $('#list').innerHTML = `<div class="hd"><span>${head}</span><span>${items.length}</span></div>` + (items.length ? items.map(x => `<a href="${link(x)}"${r.v === 'e' && r.id === x.id ? ' aria-current="page"' : ''}>${hl(x.t)}${q ? ` <span class="c">${esc(catOf(x.cat).name)}</span>` : ''}</a>`).join('') : '<p class="empty" style="padding:0 10px">맞는 항목이 없습니다.</p>');
    /* 좁은 화면: 항목을 읽을 때는 목록을 접어 둔다 */
    $('#side').open = !narrow.matches || r.v !== 'e';
    return true;
  }
  function block(b) {
    const part = { p: v => v.map(x => `<p>${hl(x)}</p>`).join(''), steps: v => `<ol>${v.map(x => `<li>${hl(x)}</li>`).join('')}</ol>`, list: v => `<ul>${v.map(x => `<li>${hl(x)}</li>`).join('')}</ul>`, dl: v => `<dl class="dl">${v.map(([k, d]) => `<dt>${hl(k)}</dt><dd>${hl(d)}</dd>`).join('')}</dl>` };
    return `<div class="blk">${b.h ? `<h2>${hl(b.h)}</h2>` : ''}${Object.keys(b).filter(k => part[k]).map(k => part[k](b[k])).join('')}</div>`;
  }
  function entry(x) {
    const c = catOf(x.cat), sib = inCat(x.cat), i = sib.indexOf(x), pv = sib[i - 1], nx = sib[i + 1];
    const rel = x.rel.map(id => BY[id]).filter(Boolean), back = W.entries.filter(y => y.rel.includes(x.id) && !x.rel.includes(y.id)).slice(0, 4);
    return `<p class="crumb"><a href="#/c/${c.id}">${esc(c.name)}</a></p><h1>${hl(x.t)}</h1><p class="sum">${hl(x.s)}</p>${x.b.map(block).join('')}` +
      (rel.length || back.length ? `<p class="sec-t">관련 항목</p><div class="rows">${rel.concat(back).map(y => row(y, y.cat !== x.cat ? catOf(y.cat).name : '')).join('')}</div>` : '') +
      `<div class="pn">${pv ? `<a href="${link(pv)}"><small>이전</small>${esc(pv.t)}</a>` : '<span></span>'}${nx ? `<a href="${link(nx)}" style="text-align:right"><small>다음</small>${esc(nx.t)}</a>` : ''}</div>`;
  }
  function home() {
    return `<div class="home"><div><h1>잔향 백과</h1><p class="lead">게임을 하다 모르는 개념이 나오면 위 분류 탭이나 검색으로 찾아보세요. 처음이라면 <a href="#/e/first30">처음 30분</a>부터 보면 됩니다.</p>` +
      `<p class="sec-t">자주 찾는 항목</p><div class="rows">${W.featured.map(id => row(BY[id], catOf(BY[id].cat).name)).join('')}</div>` +
      `<p class="sec-t">분류</p><div class="rows">${W.cats.map(c => `<a href="#/c/${c.id}">${ic(c.icon)}<b>${esc(c.name)}</b><small>${esc(c.desc)}</small><span class="n">${inCat(c.id).length}</span></a>`).join('')}</div></div>` +
      `<aside class="about"><h2>정보</h2><p>${esc(W.notice)}</p><ul><li>${ic('doc')}항목 ${W.entries.length}개</li><li>${ic('history')}${esc(W.updated)} 갱신</li><li>${ic('book')}<span class="tag">게임 ${esc(W.game)}</span></li></ul>` +
      `<h2>도움</h2><ul><li>${ic('help')}<a href="#/faq">자주 묻는 질문</a></li><li>${ic('history')}<a href="#/log">업데이트 내역</a></li><li>${ic('mail')}<a href="#/ask">건의·질문 남기기</a></li></ul></aside></div>`;
  }
  function catPage(c) { return `<h1>${esc(c.name)}</h1><p class="sum">${esc(c.desc)}</p><div class="rows">${inCat(c.id).map(x => row(x)).join('')}</div>`; }
  function render() {
    if (!W) return;
    const r = route();
    const curCat = r.v === 'c' ? r.id : r.v === 'e' && BY[r.id] ? BY[r.id].cat : '';
    tabs(r, curCat);
    const hasSide = side(r, curCat);
    $('#side').hidden = !hasSide; $('#body').classList.toggle('wide', !hasSide);
    $('#desk').hidden = r.v !== 'ask'; $('#art').hidden = r.v === 'ask';
    let html = '', title = '잔향 위키';
    if (r.v === 'e' && BY[r.id]) { html = entry(BY[r.id]); title = BY[r.id].t + ' · 잔향 위키'; }
    else if (r.v === 'c' && catOf(r.id)) { html = catPage(catOf(r.id)); title = catOf(r.id).name + ' · 잔향 위키'; }
    else if (q) html = `<h1>'${esc(q)}' 찾기</h1><p class="sum">${search(q).length}개 항목이 맞습니다.</p><div class="rows">${search(q).map(x => row(x, catOf(x.cat).name)).join('')}</div>`;
    else if (r.v === 'faq') { title = '자주 묻는 질문 · 잔향 위키'; html = `<h1>자주 묻는 질문</h1><div class="faq">${W.faq.map(([a, b, id]) => `<details><summary>${esc(a)}</summary><p>${esc(b)}${id && BY[id] ? ` <a href="${link(BY[id])}">${esc(BY[id].t)} 항목 보기 ›</a>` : id === null ? ' <a href="#/ask">건의·질문 ›</a>' : ''}</p></details>`).join('')}</div>`; }
    else if (r.v === 'log') { title = '업데이트 내역 · 잔향 위키'; html = `<h1>업데이트 내역</h1><div class="log">${W.log.map(c => `<div class="row"><div class="v">${esc(c.v)}<small>${esc(c.date)}</small></div><ul>${c.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`; }
    else if (r.v === 'ask') title = '건의·질문 · 잔향 위키';
    else html = home();
    $('#art').innerHTML = html; document.title = title;
  }
  let lastHash = '';
  window.addEventListener('hashchange', () => { if (location.hash !== lastHash) { lastHash = location.hash; if (q && route().v !== 'e') { q = ''; $('#q').value = ''; } render(); scrollTo(0, 0); } });
  let qt = 0; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { q = e.target.value.trim().slice(0, 30); render(); }, 120); });
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && q) { const f = search(q)[0]; if (f) location.hash = link(f); } if (e.key === 'Escape') { e.target.value = ''; q = ''; render(); } });
  document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });
  narrow.addEventListener && narrow.addEventListener('change', render);
  fetch('wiki.json', { cache: 'no-store' }).then(r => r.json()).then(d => { W = d; d.entries.forEach(x => { BY[x.id] = x; }); lastHash = location.hash; render(); })
    .catch(() => { $('#art').innerHTML = '<p class="empty">위키 내용을 불러오지 못했습니다. 잠시 뒤 새로 고침해 주세요.</p>'; });

  /* ===== 건의·질문 창구(로그인 없음, Supabase 표 ideas · supabase.sql)
     공개 글: 누구나 읽기. 비공개 글: 이 브라우저의 열쇠(jh.key)로 my_ideas()를 불러야 본인 글만 돌아온다. 운영진은 Supabase 화면에서 모두 본다. */
  const CATS = [['idea', '건의'], ['ask', '질문']], ST = { new: '접수', review: '검토 중', done: '반영됨', hold: '보류', answered: '답변함' };
  const catName = c => c === 'ask' ? '질문' : '건의';
  const COLS = 'id,created_at,cat,title,body,nick,status,reply,private';
  let cat = 'idea', flt = 'all', sb = null, pub = [], own = [], busy = false, key = '', started = false;
  try { key = localStorage.getItem('jh.key') || ''; } catch (e) {}
  if (!/^[0-9a-f]{64}$/.test(key)) { const a = new Uint8Array(32); crypto.getRandomValues(a); key = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('jh.key', key); } catch (e) {} }
  $('#cats').innerHTML = CATS.map(([k, l]) => `<button class="chip" type="button" data-c="${k}" aria-pressed="${k === cat}">${l}</button>`).join('');
  $('#flt').innerHTML = `<span class="hint">보기</span>` + [['all', '전체']].concat(CATS).concat([['mine', '내 글']]).map(([k, l]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${k === flt}">${l}</button>`).join('');
  $('#cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; document.querySelectorAll('#cats .chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('#flt').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; flt = b.dataset.f; document.querySelectorAll('#flt .chip').forEach(x => x.setAttribute('aria-pressed', String(x === b))); ideas(); });
  const valid = () => $('#iTitle').value.trim().length >= 2 && $('#iBody').value.trim().length >= 5;
  const sync = () => { $('#iSend').disabled = !sb || busy || !valid(); };
  ['#iTitle', '#iBody'].forEach(s => $(s).addEventListener('input', sync));
  function ideas() {
    const mineIds = new Set(own.map(r => String(r.id))), all = own.concat(pub.filter(r => !mineIds.has(String(r.id)))).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const L = all.filter(r => flt === 'all' || (flt === 'mine' ? mineIds.has(String(r.id)) : (r.cat === 'ask' ? 'ask' : 'idea') === flt));
    $('#ideaList').innerHTML = L.length ? L.map(r => `<article class="idea"><div class="hd"><span class="k">${catName(r.cat)}</span><span class="st ${r.status === 'done' ? 'done' : ''}">${esc(ST[r.status] || '접수')}</span>${r.private ? '<span class="pv">비공개</span>' : ''}<span>${esc(r.nick || '익명 헌터')}${mineIds.has(String(r.id)) ? ' (나)' : ''} · ${new Date(r.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span></div><b>${esc(r.title)}</b><p>${esc(r.body)}</p>${r.reply ? `<div class="re"><b>운영진</b> ${esc(r.reply)}</div>` : ''}</article>`).join('')
      : `<p class="empty">${flt === 'all' ? '아직 남겨진 글이 없습니다.' : flt === 'mine' ? '이 브라우저에서 남긴 글이 없습니다.' : '이 분류의 글이 없습니다.'}</p>`;
  }
  async function load() {
    if (!sb) return;
    const [a, b] = await Promise.all([sb.from('ideas').select(COLS).eq('private', false).order('created_at', { ascending: false }).limit(200), sb.rpc('my_ideas', { p_key: key })]);
    if (a.error) { $('#ideaList').innerHTML = '<p class="empty">목록을 불러오지 못했습니다. 잠시 뒤 새로 고침해 주세요.</p>'; console.error('ideas load', a.error); return; }
    pub = a.data || []; if (!b.error && Array.isArray(b.data)) own = b.data; else if (b.error) console.error('my_ideas', b.error);
    ideas();
  }
  /* 창구는 건의·질문 화면을 처음 열 때 연결한다 */
  function boot() {
    if (started) return; started = true;
    const C = window.JH_CONFIG || {};
    if (!window.supabase || !C.supabaseUrl || !C.supabaseAnonKey || /YOUR_/.test(C.supabaseUrl)) { $('#ideaList').innerHTML = '<p class="empty">창구를 준비하고 있습니다.</p>'; return; }
    let base = String(C.supabaseUrl).trim(); try { base = new URL(base).origin; } catch (e) {}
    sb = window.supabase.createClient(base, String(C.supabaseAnonKey).trim(), { auth: { persistSession: false } });
    load(); setInterval(() => { if (route().v === 'ask') load(); }, 60000); sync();
  }
  const maybeBoot = () => { if (route().v === 'ask') boot(); };
  window.addEventListener('hashchange', maybeBoot); maybeBoot();
  $('#iSend').addEventListener('click', async () => {
    if (!sb || busy || !valid()) return;
    busy = true; sync(); $('#iStatus').textContent = '남기는 중…';
    const priv = $('#iPriv').checked;
    const { error } = await sb.rpc('submit_idea', { p_cat: cat, p_title: $('#iTitle').value.trim().slice(0, 60), p_body: $('#iBody').value.trim().slice(0, 1200), p_nick: $('#iNick').value.trim().slice(0, 16), p_private: priv, p_key: key });
    if (error) { $('#iStatus').textContent = /daily limit/.test(error.message || '') ? '오늘은 5건을 모두 남겼습니다. 내일 다시 남겨 주세요.' : '남기지 못했습니다. 잠시 뒤 다시 눌러 주세요.'; console.error('submit_idea', error); }
    else { $('#iTitle').value = ''; $('#iBody').value = ''; $('#iPriv').checked = false; $('#iStatus').textContent = priv ? '비공개로 남겼습니다. 운영진과 나만 볼 수 있습니다.' : '남겼습니다. 운영진이 확인하면 상태가 바뀝니다.'; await load(); }
    busy = false; sync();
  });
})();
</script>
</body>
</html>
